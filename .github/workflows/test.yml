name: test-jupyterlite
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # hourly schedule at minute 12 (to avoid peaks on round minutes 0 and 5, I
  # seem to vaguely remember something like this)
  schedule:
    - cron: "12 * * * *"

# Cancel in-progress workflows when pushing
# a new commit on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jupyterlite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install pytest-playwright
      - run: playwright install chromium
      - run: pytest test_jupyterlite.py --tracing retain-on-failure --durations=0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: traces
          path: test-results
